# Build validation

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS
          cache: maven

      - name: Build and verify
        run: mvn -B -U clean verify
